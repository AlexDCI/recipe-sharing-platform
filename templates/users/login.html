{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
    <h2>Login to Your Account</h2>
    <form method="post" class="form-group">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Login</button>
    </form>

    {% if messages %}
    <ul class="alert alert-danger">
        {% for message in messages %}
        <li>{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}
{% endblock %}
